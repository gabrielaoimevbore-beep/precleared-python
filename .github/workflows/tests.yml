name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # ubuntu-latest is now Ubuntu 26.04, which has no Python 3.9 build;
    # 24.04 still has one, and we still support 3.9.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest anyio
      - run: pytest -q
